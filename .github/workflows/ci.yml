name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Los tests no necesitan el dataset ni los pesos entrenados.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
