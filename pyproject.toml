[project]
name = "dental-vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pycocotools>=2.0.11",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

# Sin build-system, uv trata el proyecto como "virtual" y no lo instala: el
# paquete solo se importaba desde los scripts, que tocaban sys.path a mano.
[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dentalvision"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
demo = [
    "gradio>=6.28",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16",
]

# Las reglas de siempre (errores reales), fijadas: ruff 0.16 activa por defecto
# reglas de estilo que marcan idiomas correctos, como gr.Progress() por defecto.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
